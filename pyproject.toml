[project]
name = "house-watch"
version = "0.1.0"
description = "Monitor de propiedades en portales uruguayos. Batch job efimero, costo USD 0/mes."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "orjson>=3.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Solo necesario en produccion (Turso). En local alcanza con sqlite3 del stdlib.
turso = ["libsql>=0.1.0"]
browser = ["playwright>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
house-watch = "house_watch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
