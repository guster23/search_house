name: House Watch

on:
  # Permite dispararlo a mano desde la pestaña Actions de GitHub.
  workflow_dispatch:

  schedule:
    # Minuto 17 y no 00: los jobs programados en punto compiten con medio
    # GitHub y arrancan con mas retraso. La app no necesita precision.
    - cron: "17 * * * *"

# Evita que dos ejecuciones se pisen. cancel-in-progress queda en false para
# no matar un run que ya esta escribiendo en la base.
concurrency:
  group: house-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    # Techo duro de costo: 24 runs/dia x 31 dias x 4 min = 2976 min/mes, dentro
    # de los 2000 gratis si el run real promedia ~1 min (InfoCasas ~20s + Gallito ~15s).
    timeout-minutes: 4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Playwright + Chromium necesarios para Gallito (Cloudflare managed challenge).
      - name: Instalar
        run: |
          pip install --disable-pip-version-check -e '.[turso,browser]'
          python -m playwright install --with-deps chromium

      # xvfb-run provee un display virtual para Chrome headed, que es el modo
      # que mejor pasa el challenge de Cloudflare.
      - name: Ejecutar House Watch
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: xvfb-run -a house-watch run --config config.yaml
