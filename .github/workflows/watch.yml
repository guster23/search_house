name: House Watch

on:
  # Permite dispararlo a mano desde la pestaña Actions de GitHub.
  workflow_dispatch:

  schedule:
    # Minuto 17 y no 00: los jobs programados en punto compiten con medio
    # GitHub y arrancan con mas retraso. La app no necesita precision.
    - cron: "17 * * * *"

# Evita que dos ejecuciones se pisen. cancel-in-progress queda en false para
# no matar un run que ya esta escribiendo en la base.
concurrency:
  group: house-watch
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    # Techo duro de costo: 24 runs/dia x 31 dias x 2 min = 1488 min/mes, dentro
    # de los 2000 gratis. En la practica cada run tarda ~20s, y como Actions
    # factura por minuto entero redondeando hacia arriba, el gasto real ronda
    # los 744 min/mes.
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Sin Playwright ni Chromium: ningun scraper activo necesita navegador.
      - name: Instalar
        run: pip install --disable-pip-version-check -e '.[turso]'

      - name: Ejecutar House Watch
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: house-watch run --config config.yaml
