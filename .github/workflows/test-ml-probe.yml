# Test de viabilidad: Chrome headed + perfil persistente contra ML dentro del
# runner de GitHub Actions. Si esto pasa, house_watch puede scrapear ML 100%
# en Actions a $0. Workflow de diagnostico: no escribe en la base ni manda
# mensajes; deja el veredicto en el log y lo publica (con evidencia) en la
# rama orfana probe-veredicto, legible por cualquiera sin autenticacion.

name: Test ML probe

on:
  workflow_dispatch: {}
  push:
    branches:
      - feat/mercadolibre-api
    paths:
      - ".github/workflows/test-ml-probe.yml"
      - "scripts/test_ml_ci.py"

# El probe no escribe nada, pero si dos corren a la vez se pisan el perfil
# cacheado. Serializa sin cancelar la que ya arranco.
concurrency:
  group: ml-probe
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependencias
        run: |
          pip install --disable-pip-version-check -e '.[turso]' playwright
          python -m playwright install --with-deps chromium

      # El perfil con cookies de ML persiste entre corridas: si en una corrida
      # el runner "gana" la confianza, las siguientes arrancan calentitas.
      - name: Restaurar perfil Chrome
        uses: actions/cache@v4
        with:
          path: /tmp/ml-chrome-profile
          key: ml-profile-v1

      - name: Probe ML (headed bajo Xvfb)
        id: probe
        env:
          ML_PROFILE_DIR: /tmp/ml-chrome-profile
          ML_EVIDENCE_DIR: /tmp/ml-evidencia
          ML_STORAGE_STATE_FILE: /tmp/ml-storage-state.json
          ML_STORAGE_STATE: ${{ secrets.ML_STORAGE_STATE }}
        run: |
          # Cookies del perfil local exportadas a storage_state (Secret): si ML
          # liga el trust al device en vez de a la IP, el trasplante abre el
          # muro de login. Si el secret no existe, corre con perfil anonimo.
          if [ -n "$ML_STORAGE_STATE" ]; then
            printf '%s' "$ML_STORAGE_STATE" > /tmp/ml-storage-state.json
            echo "storage_state presente ($(wc -c < /tmp/ml-storage-state.json) bytes)"
          else
            echo "sin secret ML_STORAGE_STATE: perfil anonimo del runner"
          fi
          xvfb-run -a --server-args="-screen 0 1440x900x24" \
            python scripts/test_ml_ci.py

      # Rojo = no viable desde el runner; verde = viable. El detalle queda en
      # el log del probe (linea VEREDICTO:).
      - name: Veredicto
        if: always()
        run: |
          echo "Exit code del probe: ${{ steps.probe.outcome }} (0=ok viable, 1=muro/captcha, 2=error de ML, 3=timeout)"

      # Publica veredicto + HTML + captura en la rama orfana probe-veredicto:
      # se puede leer con raw.githubusercontent.com sin ningun token.
      - name: Publicar evidencia
        if: always()
        run: |
          cd /tmp/ml-evidencia
          git init -q -b probe-veredicto .
          git config user.name "ml-probe"
          git config user.email "actions@github.com"
          git add -A
          git commit -qm "probe $(date -u +%Y-%m-%dT%H:%M:%SZ) exit=${{ steps.probe.outcome }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-veredicto
          echo "Evidencia en: https://github.com/${{ github.repository }}/blob/probe-veredicto/veredicto.txt"
