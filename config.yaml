# House Watch Uruguay -- configuracion no sensible.
# Los secretos NUNCA van aca: van en GitHub Actions Secrets (ver README).
#
# TODO(usuario): ajustar a tus criterios reales. Los valores de abajo son el
# ejemplo de la especificacion, no tus preferencias.

# ---------------------------------------------------------------------------
# Fuentes y busquedas.
#
# Arma la busqueda buena a mano en el portal (con sus propios filtros) y pega
# la URL resultante aca. Asi aprovechamos los filtros nativos del portal.
#
# AVISO InfoCasas: su robots.txt prohibe las URLs de filtro combinado "*-y-*"
# (ej. /venta/casas-y-apartamentos/...). Usa una busqueda por tipo. El loader
# valida esto y falla con un mensaje claro.
# ---------------------------------------------------------------------------
sources:

  infocasas:
    enabled: true
    searches:
      - name: montevideo
        url: https://www.infocasas.com.uy/venta/casas/montevideo
      - name: canelones-ciudad-de-la-costa
        url: https://www.infocasas.com.uy/venta/casas/canelones/ciudad-de-la-costa
      - name: canelones-costa-de-oro
        url: https://www.infocasas.com.uy/venta/casas/canelones/costa-de-oro

  # MercadoLibre: descartada tras diagnostico completo (2026-10-02). La API
  # responde 403 para apps personales nuevas y el web exige login a IPs de
  # datacenter (GitHub Actions). Detalles en HANDOFF.md.

  # Gallito sigue bloqueado: Cloudflare managed challenge.
  # Sin workaround limpio disponible por ahora.
  gallito:
    enabled: false
    searches:
      - name: montevideo
        url: https://www.gallito.com.uy/inmuebles/casas/venta

# ---------------------------------------------------------------------------
# Filtros duros. Si una propiedad no los pasa, no se alerta nunca.
# ---------------------------------------------------------------------------
filters:
  currency: USD
  max_price: 200000
  min_bedrooms: 2
  min_built_area_m2: 60

  # Rechazo inmediato por texto en titulo o descripcion.
  reject_keywords:
    - nuda propiedad
    - derechos posesorios
    - derechos y acciones
    - ocupada
    - ocupado
    - anticresis
    - en pozo
    - obra nueva en pozo

  # Departamentos aceptados. Vacio = todos.
  allowed_departments:
    - Montevideo
    - Canelones

  # Lista blanca exclusiva. Solo se alertan casas en estos barrios/zonas.
  allowed_neighborhoods:
    # Montevideo
    - Buceo
    - Pocitos
    - Pocitos Nuevo
    - Punta Carretas
    - Parque Rodó
    - Parque Batlle
    - Tres Cruces
    - Palermo
    - Barrio Sur
    - Cordon
    - Prado
    # Costa Canelones
    - Solymar
    - Lagomar
    - El Pinar
    - Neptunia

# ---------------------------------------------------------------------------
# Scoring de preferencias. Determinista, sin IA. Editable sin tocar codigo.
#
# Con minimum_alert_score: 0 se alerta todo lo que pase los filtros duros.
# Si empieza a llegar demasiado ruido, subi el umbral de a 10 puntos.
# ---------------------------------------------------------------------------
scoring:
  base: 50

  # Rango de precio "ideal" (no el maximo aceptable).
  ideal_price:
    min: 80000
    max: 180000
    points: 20

  preferred_neighborhoods:
    points: 15
    names:
      # Montevideo
      - Buceo
      - Pocitos
      - Pocitos Nuevo
      - Punta Carretas
      - Parque Rodó
      - Parque Batlle
      - Tres Cruces
      - Palermo
      - Barrio Sur
      - Cordon
      - Prado
      # Costa Canelones
      - Solymar
      - Lagomar
      - El Pinar
      - Neptunia

  bedrooms:
    ideal_min: 2
    points: 5

  land_area:
    min_m2: 150
    points: 10

  # Puntos por caracteristica detectada (facilities del portal + texto).
  features:
    garage: 2
    fondo: 8          # importante para vos
    parrillero: 3
    padron_unico: 8   # importante para vos
    acepta_banco: 8   # importante para vos
    piscina: 2

# ---------------------------------------------------------------------------
# Alertas.
# ---------------------------------------------------------------------------
alerts:
  # 0 = alerta todo lo que pase los filtros duros (sin score minimo).
  # Si recibis demasiado ruido, cambialo a 60 o 70.
  minimum_alert_score: 0
  price_drop_threshold_percent: 5

  # Techo de mensajes por corrida. Lo que pasa el techo NO se descarta: queda
  # reservado y se envia en las corridas siguientes, de a poco.
  max_alerts_per_run: 8

# ---------------------------------------------------------------------------
# Deteccion de oportunidad.
# ---------------------------------------------------------------------------
opportunity:
  enabled: true
  min_comparables: 15
  built_area_bucket_m2: 50
  land_area_bucket_m2: 400
  significant_discount_percent: 10

# ---------------------------------------------------------------------------
# Proteccion contra scraping excesivo.
# ---------------------------------------------------------------------------
scraping:
  max_search_pages_per_source: 5
  max_detail_requests_per_run: 20
  request_timeout_seconds: 10
  retries: 2
  jitter_ms: [150, 450]

# ---------------------------------------------------------------------------
# Presupuesto de ejecucion. El workflow corta a los 2 minutos.
# ---------------------------------------------------------------------------
runtime:
  deadline_seconds: 100

# ---------------------------------------------------------------------------
# Salud de fuentes y ciclo de vida.
# ---------------------------------------------------------------------------
health:
  degrade_after_consecutive_failures: 3
  mark_inactive_after_missed_observations: 4

retention:
  scrape_runs_days: 90
  listing_versions_days: 365

weekly_summary: true
